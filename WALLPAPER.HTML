<!DOCTYPE html>
<html>

<body style="background:black;color:white;text-align:center;font-family:Arial">


<h1>🖼 Wallpaper</h1>



<button onclick="change('black')">
⬛ Black
</button>


<br>


<button onclick="change('blue')">
🌌 Blue
</button>


<br>


<button onclick="change('purple')">
🟣 Purple
</button>


<br><br>


<a href="../index.html">
<button>
🏠 HOME
</button>
</a>



<script>

function change(c){

localStorage.setItem(
"wall",
c
);

document.body.style.background=c;

}


document.body.style.background=
localStorage.getItem("wall")||"black";


</script>


</body>

</html>
